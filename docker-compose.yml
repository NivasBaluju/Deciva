# =============================================================================
# Deciva AI — Multi-Service Production Orchestration (Docker Compose)
#
# NOTE: This compose manifest represents the reproducible LOCAL / SELF-HOSTED
# deployment option (React/Static -> Node Gateway -> Python AI -> PostgreSQL).
# In CLOUD production environments, managed infrastructure is utilized:
# React/Vercel -> Node/Render -> Flask/Render -> Neon PostgreSQL.
# The local PostgreSQL container is NOT a replacement for managed Neon in cloud.
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Tier 3: PostgreSQL Database (Local / Self-Hosted Enclave)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: deciva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deciva}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deciva_local_secret}
    ports:
      - "5432:5432"
    volumes:
      - deciva_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-deciva}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - deciva-network

  # ---------------------------------------------------------------------------
  # Tier 4: Python / Flask AI Microservice
  # ---------------------------------------------------------------------------
  ai-microservice:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: deciva-ai-microservice
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      FLASK_ENV: production
      PORT: 5001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-deciva_local_secret}@postgres:5432/${POSTGRES_DB:-deciva}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-deciva_internal_service_key_secret_32b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5000,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - deciva-network

  # ---------------------------------------------------------------------------
  # Tier 2: Node.js / Express API Gateway & Static Frontend
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: deciva-api-gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-deciva_local_secret}@postgres:5432/${POSTGRES_DB:-deciva}
      JWT_SECRET: ${JWT_SECRET:-deciva_production_jwt_secret_64char_minimum_entropy_required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-deciva_internal_service_key_secret_32b}
      AI_MICROSERVICE_URL: http://ai-microservice:5001
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5000}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      ai-microservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - deciva-network

volumes:
  deciva_pgdata:
    name: deciva_pgdata

networks:
  deciva-network:
    name: deciva-network
    driver: bridge

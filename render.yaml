services:
  # ---------------------------------------------------------------------------
  # Tier 2: Node.js / Express API Gateway
  # Note: Configured with plan: free for non-production verification.
  # For high-throughput production SLA, restore plan: starter.
  # ---------------------------------------------------------------------------
  - type: web
    name: deciva-api-gateway
    env: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: INTERNAL_SERVICE_KEY
        fromService:
          type: web
          name: deciva-ai-backend
          envVarKey: INTERNAL_SERVICE_KEY
      - key: AI_MICROSERVICE_URL
        fromService:
          type: web
          name: deciva-ai-backend
          property: host
      - key: CLIENT_URL
        value: https://deciva-ai.vercel.app

  # ---------------------------------------------------------------------------
  # Tier 4: Python / Flask AI Microservice
  # Note: Configured with plan: free and --workers 1 for non-production
  # verification to strictly respect Render Free instance memory limits (512MB).
  # For high-concurrency production SLA, restore plan: starter and --workers 2.
  # ---------------------------------------------------------------------------
  - type: web
    name: deciva-ai-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_SERVICE_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://deciva-ai.vercel.app,http://localhost:5000,http://localhost:3000
